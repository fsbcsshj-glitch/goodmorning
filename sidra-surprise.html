<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A Little World for You</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#08050d;color:#ffe3f1;
 font-family:Georgia,serif;min-height:100vh;
 display:flex;align-items:center;justify-content:center;
 overflow:hidden;text-align:center
}
#scene{position:fixed;inset:0;pointer-events:none}
.card{position:relative;z-index:2;padding:25px;width:100%;max-width:420px}
h1{font-size:27px;font-weight:normal;color:#ffb2d7}
p{line-height:1.9;font-size:17px}
button{
 background:#ff9dcc;color:#270b1b;border:0;border-radius:30px;
 padding:15px 24px;font-size:16px;margin-top:22px
}
#message{display:none;animation:fade 2s ease}
.flower{position:absolute;animation:fall linear infinite;top:-40px}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
#heart{font-size:62px;display:block;margin:22px;animation:pulse 1.8s infinite}
@keyframes pulse{50%{transform:scale(1.13);text-shadow:0 0 30px #ff6eaf}}
</style>
</head>
<body>
<div id="scene"></div>
<div class="card">
 <div id="intro">
  <div style="font-size:42px">🌙</div>
  <h1>Aapke liye ek chhoti si duniya ♡</h1>
  <p>Bas ek pal… sirf apne liye.</p>
  <button onclick="openGift()">Yahan touch kijiye 🌸</button>
 </div>
 <div id="message">
  <div id="heart">♡</div>
  <h1>Good Morning 🌸</h1>
  <p>
   Aap sabka khayal rakhti hain…<br>
   par aaj ek chhoti si yaad-dihani aapke liye bhi.<br><br>
   Khud ka bhi khayal rakha kijiye.<br>
   Aapki muskurahat bhi utni hi zaroori hai. ♡
  </p>
  <p style="font-size:14px;color:#ffb2d7">Aaj ka din aapke liye narm aur khoobsurat ho.</p>
 </div>
</div>
<script>
function openGift(){
 document.getElementById('intro').style.display='none';
 document.getElementById('message').style.display='block';
 for(let i=0;i<32;i++){
  let f=document.createElement('div');
  f.className='flower';
  f.textContent=['🌸','✿','♡','✨'][Math.floor(Math.random()*4)];
  f.style.left=Math.random()*100+'%';
  f.style.animationDuration=(5+Math.random()*8)+'s';
  f.style.animationDelay=Math.random()*4+'s';
  f.style.fontSize=(14+Math.random()*18)+'px';
  document.getElementById('scene').appendChild(f);
 }
}
</script>
</body>
</html>
