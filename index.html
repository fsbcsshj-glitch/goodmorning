<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Good Morning ♡</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
background:#050008;
color:#ff8acb;
height:100dvh;
overflow:hidden;
font-family:Georgia,serif;
}

canvas{
position:absolute;
inset:0;
width:100%;
height:100%;
}

.message{
position:absolute;
bottom:7%;
left:0;
width:100%;
text-align:center;
font-size:clamp(20px,6vw,32px);
color:#ffe1f3;
text-shadow:0 0 8px #ff4fa9,0 0 22px #ff168d;
animation:glow 2s infinite alternate;
letter-spacing:1px;
}

@keyframes glow{
from{opacity:.75;text-shadow:0 0 8px #ff4fa9}
to{opacity:1;text-shadow:0 0 18px #ff4fa9,0 0 35px #ff168d}
}
</style>
</head>

<body>
<canvas id="heart"></canvas>
<div class="message">Good Morning ♡</div>

<script>
const canvas=document.getElementById("heart");
const ctx=canvas.getContext("2d");

let W,H,points=[],stars=[],started=0;

function resize(){
W=canvas.width=innerWidth*devicePixelRatio;
H=canvas.height=innerHeight*devicePixelRatio;
canvas.style.width=innerWidth+"px";
canvas.style.height=innerHeight+"px";
ctx.setTransform(1,0,0,1,0,0);
ctx.scale(devicePixelRatio,devicePixelRatio);
W=innerWidth;
H=innerHeight;
createHeart();
createStars();
}

function createHeart(){
points=[];
let scale=Math.min(W/36,H/43)*0.83;
let cx=W/2,cy=H*0.43;

for(let y=-1.35;y<=1.35;y+=0.055){
for(let x=-1.5;x<=1.5;x+=0.055){
let a=x*x+y*y-1;
if(a*a*a-x*x*y*y*y<=0){
points.push({
x:cx+x*16*scale,
y:cy-y*16*scale,
ox:Math.random()*W,
oy:Math.random()*H,
delay:Math.random()*1800,
phase:Math.random()*6.28,
size:Math.random()*0.8+0.6
});
}
}
}
}

function createStars(){
stars=[];
for(let i=0;i<100;i++){
stars.push({
x:Math.random()*W,
y:Math.random()*H,
r:Math.random()*1.5+0.3,
a:Math.random()
});
}
}

function draw(t){
ctx.clearRect(0,0,W,H);

for(const s of stars){
ctx.beginPath();
ctx.fillStyle=`rgba(255,125,203,${0.15+Math.abs(Math.sin(t/900+s.a))*0.55})`;
ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
ctx.fill();
}

const elapsed=t-started;

for(const p of points){
let progress=Math.min(1,Math.max(0,(elapsed-p.delay)/1700));
progress=progress*progress*(3-2*progress);

let x=p.ox+(p.x-p.ox)*progress;
let y=p.oy+(p.y-p.oy)*progress;

let pulse=1+Math.sin(t/650+p.phase)*0.035;
x=W/2+(x-W/2)*pulse;
y=H*0.43+(y-H*0.43)*pulse;

ctx.font=`bold ${Math.max(5,Math.min(8,W/42))}px Georgia`;
ctx.textAlign="center";
ctx.textBaseline="middle";
ctx.shadowBlur=progress?5:0;
ctx.shadowColor="#ff168d";
ctx.fillStyle=`rgba(255,${105+Math.floor(Math.random()*35)},${190+Math.floor(Math.random()*55)},${0.5+progress*0.5})`;
ctx.fillText("Good Morning",x,y);
}

ctx.shadowBlur=0;
requestAnimationFrame(draw);
}

resize();
started=performance.now();
requestAnimationFrame(draw);
addEventListener("resize",resize);
</script>
</body>
</html>
